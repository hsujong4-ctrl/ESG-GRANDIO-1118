<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>離線中 ・ 台南市開放資料瀏覽器</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#f1f5f9;color:#0f172a;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:380px}
  .icon{font-size:56px}
  h1{font-size:1.3rem;margin:12px 0 8px}
  p{color:#64748b;line-height:1.6}
  button{margin-top:16px;font:inherit;padding:12px 24px;border:none;border-radius:10px;
    background:#2563eb;color:#fff;cursor:pointer;width:100%;max-width:240px}
  button:hover{background:#1d4ed8}
  @media (prefers-color-scheme:dark){
    body{background:#0b1220;color:#e2e8f0}
    p{color:#94a3b8}
  }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>目前無法連線</h1>
  <p>請確認網路連線後再試一次。若先前已瀏覽過，部分內容仍可能可用。</p>
  <button onclick="location.reload()">重新整理</button>
</div>
</body>
</html>
